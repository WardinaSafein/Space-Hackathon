name: Space Sleuths browser checks
on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'tests/**'
      - 'playwright.config.cjs'
      - 'package.json'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:
jobs:
  browser-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify game sources
        run: |
          test -f index.html
          test -f assets/station-observatory.svg
          test -f assets/illustrated-mission-v2.css
          node -e "const fs=require('fs');const html=fs.readFileSync('index.html','utf8');for(const id of ['title','briefing','board','case','finale'])if(!html.includes('id=\"'+id+'\"'))process.exit(1);console.log('All five screens present');"
      - name: Test desktop and mobile game flow
        run: npx playwright test --reporter=line,html
      - name: Upload test report and screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: space-sleuths-browser-check
          path: |
            test-results/
            playwright-report/
          retention-days: 7
